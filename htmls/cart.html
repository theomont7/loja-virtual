<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styleCart.css">
    <title>Cart – NovaStore</title>
</head>
<body>

    <header class="header">
        <img src="../img/NovaStoreLogo.svg" alt="NovaStore Logo" class="logo">

        <nav class="navbar">
            <a href="index.html" class="links">Home</a>
            <a href="shop.html" class="links">Shop</a>
            <a href="about.html" class="links">About</a>
            <a href="contact.html" class="links">Contact</a>

            <div class="search-container">
                <input type="text" id="searchBar" placeholder="Search products...">
                <button id="searchBtn">Search</button>
            </div>

            <a href="cart.html" class="cart active">Cart</a>
            <a href="login.html" id="loginLink">Login</a>
            <a href="profile.html" id="profileLink" style="display:none;">Profile</a>
        </nav>
    </header>

    <nav class="category-nav">
        <div id="categoryNavLinks"></div>
    </nav>

    <section class="cart-section">
        <h1>Your Cart</h1>

        <div id="cartItems"></div>

        <div id="cartSummary" class="cart-summary">
            <p>Subtotal: <span id="subtotal">$0.00</span></p>
            <p>Tax (13%): <span id="tax">$0.00</span></p>
            <h3>Total: <span id="total">$0.00</span></h3>

            <div class="cart-buttons">
                <a href="shop.html" class="btn-light">Continue Shopping</a>
                <button id="checkoutBtn" class="btn-dark">Proceed to Checkout</button>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-left">
            <h3>Categories</h3>
            <ul id="footer-categories"></ul>
        </div>

        <div class="footer-center">
            <h3>Contact</h3>
            <p>Email: support@novastore.com</p>
            <p>Phone: +1 800 000 000</p>
        </div>

        <div class="footer-right">
            <h3>Newsletter</h3>
            <input type="email" placeholder="Your email">
            <button>Subscribe</button>
        </div>
    </footer>

    <script src="../js/header.js"></script>
    <script src="../js/cart.js"></script>

</body>
</html>
