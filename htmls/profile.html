<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Profile – NovaStore</title>
    <link rel="stylesheet" href="../styles/styleProfile.css">
</head>
<body>

    <header class="header">
        <img src="../img/NovaStoreLogo.svg" class="logo" alt="NovaStore Logo">

        <nav class="navbar">
            <a href="index.html" class="links">Home</a>
            <a href="shop.html" class="links">Shop</a>
            <a href="about.html" class="links">About</a>
            <a href="contact.html" class="links">Contact</a>

            <div class="search-container">
                <input type="text" id="searchBar" placeholder="Search products...">
                <button id="searchBtn">Search</button>
            </div>

            <a href="cart.html" class="cart">Cart</a>
            <a href="login.html" id="loginLink" style="display:none;">Login</a>
            <a href="profile.html" id="profileLink">Profile</a>
        </nav>
    </header>

    <nav class="category-nav">
        <div id="categoryNavLinks"></div>
    </nav>

    <section class="profile-container">
        <h1>Your Profile</h1>

        <div class="profile-card">
            <label>Name</label>
            <input type="text" id="profileName">

            <label>Email</label>
            <input type="email" id="profileEmail">

            <label>Phone</label>
            <input type="text" id="profilePhone" placeholder="Optional">

            <label>Address</label>
            <input type="text" id="profileAddress" placeholder="Optional">

            <button id="saveProfileBtn">Save Changes</button>
            <button id="logoutBtn" class="logout-btn">Logout</button>

            <p id="saveMessage" class="save-msg"></p>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-left">
            <h3>Categories</h3>
            <ul id="footer-categories"></ul>
        </div>

        <div class="footer-center">
            <h3>Contact</h3>
            <p>Email: support@novastore.com</p>
            <p>Phone: +1 800 000 000</p>
        </div>

        <div class="footer-right">
            <h3>Newsletter</h3>
            <input type="email" placeholder="Your email">
            <button>Subscribe</button>
        </div>
    </footer>

    <script src="../js/header.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>
