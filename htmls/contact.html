<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styleContact.css">
    <title>Contact – NovaStore</title>
</head>
<body>

    <header class="header">
        <img src="../img/NovaStoreLogo.svg" alt="NovaStore Logo" class="logo">

        <nav class="navbar">
            <a href="index.html" class="links">Home</a>
            <a href="shop.html" class="links">Shop</a>
            <a href="about.html" class="links">About</a>
            <a href="contact.html" class="links active">Contact</a>

            <div class="search-container">
                <input type="text" id="searchBar" placeholder="Search products...">
                <button id="searchBtn">Search</button>
            </div>

            <a href="cart.html" class="cart">Cart</a>
            <a href="login.html" id="loginLink">Login</a>
            <a href="profile.html" id="profileLink" style="display:none;">Profile</a>
        </nav>
    </header>

    <nav class="category-nav">
        <div id="categoryNavLinks"></div>
    </nav>

    <section class="contact-hero">
        <h1>Need Help?</h1>
        <p>We're here to assist you with any questions or issues.</p>
    </section>

    <section class="contact-container">
        <h2>Contact Us</h2>

        <form id="contactForm" class="contact-form">

            <div class="form-group">
                <label>Name</label>
                <input type="text" id="nameInput" placeholder="Your name">
                <small class="error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="emailInput" placeholder="Your email">
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea id="messageInput" placeholder="Write your message..."></textarea>
                <small class="error" id="messageError"></small>
            </div>

            <button type="submit" class="contact-btn">Send Message</button>

            <p id="successMessage" class="success"></p>
        </form>
    </section>

    <footer class="footer">
        <div class="footer-left">
            <h3>Categories</h3>
            <ul id="footer-categories"></ul>
        </div>

        <div class="footer-center">
            <h3>Contact</h3>
            <p>Email: support@novastore.com</p>
            <p>Phone: +1 800 000 000</p>
        </div>

        <div class="footer-right">
            <h3>Newsletter</h3>
            <input type="email" placeholder="Your email">
            <button>Subscribe</button>
        </div>
    </footer>

    <script src="../js/header.js"></script>
    <script src="../js/contact.js"></script>
</body>
</html>
